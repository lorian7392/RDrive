[package]
name = "rdrive"
version = "0.8.0"
edition = "2021"
rust-version = "1.90"
description = "A conservative WebDAV and SMB command-line file and sync client"
license = "MIT"

[dependencies]
anyhow = "=1.0.100"
async-trait = "=0.1.74"
clap = { version = "=4.4.11", features = ["derive"] }
chrono = { version = "=0.4.42", features = ["serde"] }
futures-util = "=0.3.31"
globset = "=0.4.18"
libc = "0.2"
quick-xml = "=0.38.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "system-proxy"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
smb = { version = "=0.12.1", default-features = false, features = ["async", "sign", "encrypt"] }
tokio = { version = "=1.52.0", features = ["full"] }
tokio-util = { version = "=0.7.18", features = ["io", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.23.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.24.0"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
smb = { path = "vendor/smb" }
smb-msg = { path = "vendor/smb-msg" }
