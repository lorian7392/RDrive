name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish GitHub Release
    needs: [build, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: target/release-assets
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RDRIVE_RELEASE_REPO: ${{ github.repository }}
          RDRIVE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/publish_release.py \
            --repo "$RDRIVE_RELEASE_REPO" \
            --tag "$RDRIVE_RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --assets target/release-assets
