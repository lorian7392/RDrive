name: Bug report
description: Report a reproducible problem and its expected behavior.
body:
  - type: markdown
    attributes:
      value: Use a synthetic example. Omit passwords, tokens, account addresses, private state, and business files. For vulnerabilities, read SECURITY.md first.
  - type: input
    id: version
    attributes:
      label: RDrive version and commit
      placeholder: rdrive --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and server
      description: Include macOS and CPU architecture, WebDAV or SMB server software/version, and the CLI, mount, Smart, or MCP workflow.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide redacted commands, synthetic test files, relevant options, and any custom cache or state directory.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error
    validations:
      required: true
  - type: textarea
    id: isolation
    attributes:
      label: Isolated reproduction and additional context
      description: Can you reproduce this with a temporary DAV/Samba fixture? Is recovery data still retained?
