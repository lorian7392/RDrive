name: Feature request / 功能建议
description: 描述使用场景、当前限制和希望的行为。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 使用哪个协议及入口，现有流程在哪一步受限？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 给出具体操作前后例子，以及覆盖、删除、离线和冲突的预期。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
