name: Feature request
description: Describe the use case, current limitation, and proposed behavior.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem
      description: Which protocol and workflow do you use, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Give a concrete before/after example, including overwrite, deletion, offline, and conflict expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
